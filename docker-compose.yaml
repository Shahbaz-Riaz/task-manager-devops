services:

  #-----------------Backend Service-----------------------

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:1.0
    container_name: backend
    ports:
      - 8080:8080
    depends_on:
      - mongodb
    restart: always


  #--------------Frontend Service-------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:1.0
    container_name: frontend
    ports:
      - 3000:4173
    depends_on:
      - backend
    restart: always


  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"


  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
