server {

    listen 80;

    #server_name todo.com;

    location / {
        proxy_pass http://frontend:4173;
        proxy_set_header Host $host;
    }


    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
